<!DOCTYPE html>
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>माँ लक्ष्मी घर की रसोई</title>
</head>
<body style="font-family:sans-serif;background:#fff8f0;padding:20px">
<h1>🍽️ माँ लक्ष्मी घर की रसोई</h1>
<p>घर का स्वाद, आपके घर तक ❤️</p>

<h3>सब्ज़ी-रोटी ₹59</h3>
<h3>बर्गर ₹100</h3>
<h3>पोहा ₹29</h3>

<input id="name" placeholder="नाम"><br><br>
<input id="phone" placeholder="मोबाइल"><br><br>
<textarea id="addr" placeholder="पता"></textarea><br><br>

<button onclick="order()">ऑर्डर करें</button>

<script>
function order(){
let m=`नाम: ${name.value}%0Aमोबाइल: ${phone.value}%0Aपता: ${addr.value}`;
window.open("https://wa.me/91XXXXXXXXXX?text="+m);
}
</script>
</body>
</html>
